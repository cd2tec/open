name: CBS e IBS no Simples Nacional
tagline: Calcula a CBS e o IBS de uma operação do Simples Nacional com a mesma conta da calculadora oficial da Receita Federal.
description: "Calcula a CBS e o IBS de uma operação do Simples Nacional (NFC-e, NF-e ou NFS-e) com a mesma conta da calculadora oficial da Receita Federal, conferida caso a caso, para operações a partir de 2027 (Lei Complementar 214/2025, reforma tributária). Mostra o total de CBS e de IBS, item a item, a memória de cálculo e o selo de versão, e sugere a classificação tributária (cClassTrib) a partir do NCM. Use quando a pessoa falar em CBS, IBS, Simples Nacional, reforma tributária, quanto vou pagar de CBS e IBS no Simples, alíquota efetiva de CBS e IBS do PGDAS, cClassTrib, conferir nota de fornecedor do Simples, crédito de fornecedor do Simples, testar o ERP contra a calculadora oficial ou colar o JSON da calculadora do Simples da Receita, mesmo sem citar o nome da skill. Não serve para o regime regular, lucro real ou presumido (para ele, use cbs-ibs-regime-regular), para calcular o DAS ou a alíquota efetiva do Simples a partir do faturamento, nem para emitir ou validar nota fiscal."
